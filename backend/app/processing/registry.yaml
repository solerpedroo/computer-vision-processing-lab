operations:
  - id: color_noop
    module: color
    name: Identity
    description: Returns the image unchanged to verify the processing pipeline.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_grayscale
    module: color
    name: Grayscale
    description: Converts RGB pixels to a single intensity channel.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_hsv
    module: color
    name: HSV components
    description: Converts RGB to native HSV components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_lab
    module: color
    name: Lab components
    description: Converts RGB to native Lab components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_channel_rgb
    module: color
    name: RGB channel
    description: Displays one RGB component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: red
        enum: [red, green, blue]
  - id: color_channel_hsv
    module: color
    name: HSV channel
    description: Displays one native HSV component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: hue
        enum: [hue, saturation, value]
  - id: color_channel_lab
    module: color
    name: Lab channel
    description: Displays one native Lab component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: lightness
        enum: [lightness, a, b]
  - id: color_brightness
    module: color
    name: Brightness
    description: Adds a signed intensity offset to every RGB component.
    output_kind: image
    requires_grayscale: false
    params:
      - name: amount
        type: integer
        default: 0
        min: -100
        max: 100
        step: 1
  - id: color_contrast
    module: color
    name: Contrast
    description: Scales RGB contrast around mid-gray.
    output_kind: image
    requires_grayscale: false
    params:
      - name: factor
        type: number
        default: 1.0
        min: 0.0
        max: 3.0
        step: 0.1
  - id: color_gamma
    module: color
    name: Gamma
    description: Applies gamma in normalized RGB intensity space.
    output_kind: image
    requires_grayscale: false
    params:
      - name: gamma
        type: number
        default: 1.0
        min: 0.1
        max: 3.0
        step: 0.1
  - id: spatial_box_filter
    module: spatial
    name: Box filter
    description: Averages neighboring pixels with a square kernel.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
  - id: spatial_gaussian_blur
    module: spatial
    name: Gaussian blur
    description: Smooths with a Gaussian kernel while reducing high-frequency noise.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
      - { name: sigma, type: number, default: 1.0, min: 0.1, max: 10.0, step: 0.1 }
  - id: spatial_median_filter
    module: spatial
    name: Median filter
    description: Replaces each pixel with the local median to reduce impulse noise.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
  - id: spatial_bilateral_filter
    module: spatial
    name: Bilateral filter
    description: Smooths similar pixels while preserving strong edges.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: diameter, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
      - { name: sigma_color, type: number, default: 50.0, min: 0.1, max: 250.0, step: 0.1 }
      - { name: sigma_space, type: number, default: 50.0, min: 0.1, max: 250.0, step: 0.1 }
  - id: spatial_sharpen
    module: spatial
    name: Sharpen
    description: Uses an unsharp mask to increase local contrast.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: amount, type: number, default: 1.0, min: 0.0, max: 3.0, step: 0.1 }
  - id: spatial_laplacian
    module: spatial
    name: Laplacian filter
    description: Shows the absolute second-derivative response of the image.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true }
  - id: edge_sobel_x
    module: edges
    name: Sobel X
    description: Detects vertical intensity transitions.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 7, step: 2, odd: true } ]
  - id: edge_sobel_y
    module: edges
    name: Sobel Y
    description: Detects horizontal intensity transitions.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 7, step: 2, odd: true } ]
  - id: edge_sobel_magnitude
    module: edges
    name: Sobel magnitude
    description: Combines horizontal and vertical Sobel gradients.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 7, step: 2, odd: true } ]
  - id: edge_prewitt
    module: edges
    name: Prewitt
    description: Computes a first-derivative Prewitt edge magnitude.
    output_kind: mask
    requires_grayscale: true
    params: []
  - id: edge_laplacian
    module: edges
    name: Edge Laplacian
    description: Computes an absolute second-derivative edge response.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 7, step: 2, odd: true } ]
  - id: edge_canny
    module: edges
    name: Canny
    description: Produces a binary edge map from dual thresholds.
    output_kind: mask
    requires_grayscale: true
    params:
      - { name: low_threshold, type: integer, default: 50, min: 0, max: 254, step: 1 }
      - { name: high_threshold, type: integer, default: 150, min: 1, max: 255, step: 1 }
  - id: morph_binary_threshold
    module: morphology
    name: Binary threshold
    description: Converts grayscale intensity into a binary mask.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: threshold, type: integer, default: 127, min: 0, max: 255, step: 1 } ]
  - id: morph_adaptive_threshold
    module: morphology
    name: Adaptive threshold
    description: Uses local Gaussian neighborhoods to create a binary mask.
    output_kind: mask
    requires_grayscale: true
    params:
      - { name: block_size, type: integer, default: 11, min: 3, max: 51, step: 2, odd: true }
      - { name: offset, type: integer, default: 2, min: -30, max: 30, step: 1 }
  - id: morph_otsu_threshold
    module: morphology
    name: Otsu threshold
    description: Selects a global threshold from the intensity histogram.
    output_kind: mask
    requires_grayscale: true
    params: []
  - id: morph_erode
    module: morphology
    name: Erosion
    description: Shrinks bright binary regions using a rectangular kernel.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true } ]
  - id: morph_dilate
    module: morphology
    name: Dilation
    description: Expands bright binary regions using a rectangular kernel.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true } ]
  - id: morph_opening
    module: morphology
    name: Opening
    description: Removes small bright specks through erosion then dilation.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true } ]
  - id: morph_closing
    module: morphology
    name: Closing
    description: Fills small dark holes through dilation then erosion.
    output_kind: mask
    requires_grayscale: true
    params: [ { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true } ]
