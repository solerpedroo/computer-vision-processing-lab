operations:
  - id: color_noop
    module: color
    name: Identity
    description: Returns the image unchanged to verify the processing pipeline.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_grayscale
    module: color
    name: Grayscale
    description: Converts RGB pixels to a single intensity channel.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_hsv
    module: color
    name: HSV components
    description: Converts RGB to native HSV components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_lab
    module: color
    name: Lab components
    description: Converts RGB to native Lab components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_channel_rgb
    module: color
    name: RGB channel
    description: Displays one RGB component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: red
        enum: [red, green, blue]
  - id: color_channel_hsv
    module: color
    name: HSV channel
    description: Displays one native HSV component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: hue
        enum: [hue, saturation, value]
  - id: color_channel_lab
    module: color
    name: Lab channel
    description: Displays one native Lab component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: lightness
        enum: [lightness, a, b]
  - id: color_brightness
    module: color
    name: Brightness
    description: Adds a signed intensity offset to every RGB component.
    output_kind: image
    requires_grayscale: false
    params:
      - name: amount
        type: integer
        default: 0
        min: -100
        max: 100
        step: 1
  - id: color_contrast
    module: color
    name: Contrast
    description: Scales RGB contrast around mid-gray.
    output_kind: image
    requires_grayscale: false
    params:
      - name: factor
        type: number
        default: 1.0
        min: 0.0
        max: 3.0
        step: 0.1
  - id: color_gamma
    module: color
    name: Gamma
    description: Applies gamma in normalized RGB intensity space.
    output_kind: image
    requires_grayscale: false
    params:
      - name: gamma
        type: number
        default: 1.0
        min: 0.1
        max: 3.0
        step: 0.1
  - id: spatial_box_filter
    module: spatial
    name: Box filter
    description: Averages neighboring pixels with a square kernel.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
  - id: spatial_gaussian_blur
    module: spatial
    name: Gaussian blur
    description: Smooths with a Gaussian kernel while reducing high-frequency noise.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
      - { name: sigma, type: number, default: 1.0, min: 0.1, max: 10.0, step: 0.1 }
  - id: spatial_median_filter
    module: spatial
    name: Median filter
    description: Replaces each pixel with the local median to reduce impulse noise.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
  - id: spatial_bilateral_filter
    module: spatial
    name: Bilateral filter
    description: Smooths similar pixels while preserving strong edges.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: diameter, type: integer, default: 5, min: 3, max: 31, step: 2, odd: true }
      - { name: sigma_color, type: number, default: 50.0, min: 0.1, max: 250.0, step: 0.1 }
      - { name: sigma_space, type: number, default: 50.0, min: 0.1, max: 250.0, step: 0.1 }
  - id: spatial_sharpen
    module: spatial
    name: Sharpen
    description: Uses an unsharp mask to increase local contrast.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: amount, type: number, default: 1.0, min: 0.0, max: 3.0, step: 0.1 }
  - id: spatial_laplacian
    module: spatial
    name: Laplacian filter
    description: Shows the absolute second-derivative response of the image.
    output_kind: image
    requires_grayscale: false
    params:
      - { name: kernel_size, type: integer, default: 3, min: 3, max: 31, step: 2, odd: true }
