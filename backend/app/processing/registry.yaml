operations:
  - id: color_noop
    module: color
    name: Identity
    description: Returns the image unchanged to verify the processing pipeline.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_grayscale
    module: color
    name: Grayscale
    description: Converts RGB pixels to a single intensity channel.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_hsv
    module: color
    name: HSV components
    description: Converts RGB to native HSV components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_lab
    module: color
    name: Lab components
    description: Converts RGB to native Lab components encoded for inspection.
    output_kind: image
    requires_grayscale: false
    params: []
  - id: color_channel_rgb
    module: color
    name: RGB channel
    description: Displays one RGB component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: red
        enum: [red, green, blue]
  - id: color_channel_hsv
    module: color
    name: HSV channel
    description: Displays one native HSV component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: hue
        enum: [hue, saturation, value]
  - id: color_channel_lab
    module: color
    name: Lab channel
    description: Displays one native Lab component as a grayscale image.
    output_kind: image
    requires_grayscale: false
    params:
      - name: channel
        type: enum
        default: lightness
        enum: [lightness, a, b]
  - id: color_brightness
    module: color
    name: Brightness
    description: Adds a signed intensity offset to every RGB component.
    output_kind: image
    requires_grayscale: false
    params:
      - name: amount
        type: integer
        default: 0
        min: -100
        max: 100
        step: 1
  - id: color_contrast
    module: color
    name: Contrast
    description: Scales RGB contrast around mid-gray.
    output_kind: image
    requires_grayscale: false
    params:
      - name: factor
        type: number
        default: 1.0
        min: 0.0
        max: 3.0
        step: 0.1
  - id: color_gamma
    module: color
    name: Gamma
    description: Applies gamma in normalized RGB intensity space.
    output_kind: image
    requires_grayscale: false
    params:
      - name: gamma
        type: number
        default: 1.0
        min: 0.1
        max: 3.0
        step: 0.1
